name: CI

# Runs on every push + every PR. Three jobs in parallel:
#   1. typecheck — fast, fails immediately on a TS regression
#   2. test     — Jest suite with coverage gating (jest.config.js)
#   3. doctor   — expo-doctor (warns on version drift)
#
# E2E (Maestro) is NOT in CI — it needs a connected emulator. Run it
# locally before cutting a release via `npm run test:e2e:smoke`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  doctor:
    runs-on: ubuntu-latest
    # Non-blocking: expo-doctor flags package mismatches and outdated SDK
    # alignments. We surface them via the run summary but don't fail CI on
    # them — Expo bumps happen on a different cadence than our changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx expo-doctor
