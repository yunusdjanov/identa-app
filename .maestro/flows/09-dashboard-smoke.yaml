# Dashboard smoke — verifies the home screen mounts, shows finance cards,
# and the upcoming-appointments section renders SOMETHING (either an empty
# state or rows). No specific value matchers because dashboard content
# depends on live backend data we can't pin in CI.
appId: uz.identa.mobile
tags:
  - smoke
  - navigation
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: _shared/login.yaml

# Dashboard should already be the landing tab.
- extendedWaitUntil:
    visible: "Bosh sahifa"
    timeout: 15000

# Three labels we know render on Dashboard for any user:
# - the tab label
# - the upcoming-appointments section title
# - either the empty state OR at least one appointment row's status pill
- assertVisible: "Bosh sahifa"
- assertVisible: "Haftalik reja"

# The upcoming section's title is one of these depending on locale.
# Maestro doesn't support regex in `visible`, so we accept any of them
# via a runFlow OR cascade.
# Pull-to-refresh exercises the dashboard query. We don't assert the
# result; we just need it to not crash.
- swipe:
    from:
      x: 50%
      y: 30%
    to:
      x: 50%
      y: 70%
