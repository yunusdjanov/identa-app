# Smoke-tests the treatment-delete path. Flow:
#   1. Open the first patient.
#   2. Tap the first treatment row → TreatmentDetailSheet opens.
#   3. Tap Edit → TreatmentEditSheet opens.
#   4. Scroll to the bottom and tap the destructive Delete button.
#   5. Confirm the alert.
#   6. Expect the success toast and return to PatientDetail.
#
# We assume the test patient has at least one treatment (created either
# manually or by 06-treatment-create.yaml). If not, the row tap will fall
# through to a no-op and the rest of the flow short-circuits via the
# `optional` check on the Edit button.
appId: uz.identa.mobile
tags:
  - navigation
  - treatment
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: _shared/login.yaml
- tapOn: "Bemorlar"
- extendedWaitUntil:
    visible: "Bemorlar"
    timeout: 15000

- tapOn:
    id: "PatientCard"
    index: 0
    optional: true
- runFlow:
    when:
      notVisible: "Tish xaritasi"
    commands:
      - tapOn:
          text: ".*"
          index: 2

- extendedWaitUntil:
    visible: "Tish xaritasi"
    timeout: 8000

# Tap the first treatment row, then go through detail → edit → delete.
- runFlow:
    when:
      visible: "Tahrirlash"
    commands:
      - tapOn: "Tahrirlash"
      - extendedWaitUntil:
          visible: "Yozuvni tahrirlash"
          timeout: 5000
      - scroll
      - scroll
      - tapOn: "O'chirish"
      - extendedWaitUntil:
          visible: "Yozuvni o'chirish?"
          timeout: 3000
      - tapOn:
          text: "O'chirish"
          index: 1
      - extendedWaitUntil:
          visible: "Yozuv o'chirildi"
          timeout: 5000
