# Verifies the standalone Odontogram screen renders. Steps:
#   1. Log in, open the Patients tab, pick the first patient row.
#   2. From PatientDetail tap the "Tish xaritasi" quick-link.
#   3. Confirm the odontogram header + one tooth chip is visible.
#
# We deliberately don't tap a specific tooth because data on the test
# patient may have zero treatments — we only need the chart to mount.
appId: uz.identa.mobile
tags:
  - navigation
  - odontogram
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: _shared/login.yaml
- tapOn: "Bemorlar"
- extendedWaitUntil:
    visible: "Bemorlar"
    timeout: 15000

# Open the first patient card. We match by the avatar-circle/row pattern;
# rather than guessing a specific name, just take the first row.
- tapOn:
    id: "PatientCard"
    index: 0
    optional: true

# Fallback: if the id-tagged tap missed (older row component), pick any row
# that doesn't say "Bemorlar" so we land on PatientDetail.
- runFlow:
    when:
      notVisible: "Tish xaritasi"
    commands:
      - tapOn:
          text: ".*"
          index: 2

- extendedWaitUntil:
    visible: "Tish xaritasi"
    timeout: 8000

- tapOn: "Tish xaritasi"

# Odontogram screen header + a known tooth number should render.
- extendedWaitUntil:
    visible: "Tishlar"
    timeout: 8000
- assertVisible: "Yuqori jag'"
- assertVisible: "Pastki jag'"
# Tooth 8 is always present in the chart (upper-right quadrant).
- assertVisible: "8"

# Sanity: go back to PatientDetail
- back
- assertVisible: "Tish xaritasi"
